name: CI/CD - Build, Test & Publish

on:
  push:
    branches: ["**"]          # every push, on every branch
  pull_request:
  workflow_dispatch:          # manual "Run workflow" button

env:
  REGISTRY: ghcr.io

jobs:
  # ---------- Job 1: build all images and smoke-test the whole stack ----------
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Validate docker-compose.yml
        run: docker compose config --quiet

      - name: Build all images
        run: docker compose build

      - name: Start the stack
        run: docker compose up -d

      - name: Wait for API to be healthy
        run: |
          for i in $(seq 1 30); do
            curl -sf http://localhost:5000/api/health && exit 0
            sleep 2
          done
          docker compose logs
          exit 1

      - name: Smoke test - camera POST + dashboard GET through nginx
        run: |
          curl -sf -X POST http://localhost:8080/api/entry \
               -H "Content-Type: application/json" -d '{"plate":"12-345-67"}'
          curl -sf http://localhost:8080/api/cars | grep -q '"1234567"'
          curl -sf http://localhost:8080/ | grep -q 'Galactic Spaceport'

      - name: Persistence test - down/up keeps the data (volume)
        run: |
          docker compose down          # NOT -v, so the volume stays
          docker compose up -d
          for i in $(seq 1 30); do curl -sf http://localhost:5000/api/health && break; sleep 2; done
          curl -sf http://localhost:5000/api/cars | grep -q '"1234567"'
          echo "Data survived restart ✅"

      - name: Tear down
        if: always()
        run: docker compose down -v

  # ---------- Job 2 (bonus): publish images to GitHub Container Registry ----------
  publish:
    needs: build-and-test                       # only if tests passed
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write                           # needed to push to ghcr.io
    strategy:
      matrix:
        service: [api, web]                     # run the steps once per image
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Log in to ghcr.io
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}   # automatic token, no manual secret needed

      - name: Generate tags (version number)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository }}-${{ matrix.service }}
          tags: |
            type=raw,value=latest
            type=raw,value=v1.0.${{ github.run_number }}
            type=sha,format=short

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ./${{ matrix.service }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
