server {
    listen 80;
    server_name _;

    # 1) Static files - the dashboard
    location / {
        root /usr/share/nginx/html;
        index index.html;
    }

    # 2) Reverse proxy - every request to /api/... goes to the API container.
    #    "api" is the service name in docker-compose; Docker's internal DNS resolves it.
    #    Because the browser talks to ONE origin (localhost:8080), there is no CORS problem.
    location /api/ {
        proxy_pass http://api:5000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
}
